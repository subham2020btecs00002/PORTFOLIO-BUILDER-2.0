name: 'Setup Python Service'
description: 'Configures Python, pip caching, and installs requirements with testing tools'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  service-dir:
    description: 'Subdirectory where requirements.txt is located'
    required: false
    default: 'ml-service-python'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: '${{ inputs.service-dir }}/requirements.txt'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.service-dir }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx bandit flake8
