# Docker Compose is optional / disabled.
# All services run locally on the host machine via node and python:
# - API Gateway:        npm run start:dev (port 3001)
# - Auth Service:       npm run start:dev (port 5001)
# - Portfolio Monolith: npm run start:dev (port 5000)
# - ML Service:         uvicorn app.main:app --port 8000 (port 8000)
# - Frontend:           npm start (port 3000)
#
# RabbitMQ was removed to simplify architecture in favor of direct HTTP/REST.
